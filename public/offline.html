<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline | Fashion Friday</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 420px;
      padding: 24px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
    }

    p {
      color: #555;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    button {
      background: #000;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You’re offline</h1>
    <p>
      Looks like the internet stepped out for a bit.  
      Fashion Friday will be right here when it’s back.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
